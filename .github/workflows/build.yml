name: Build postmarketOS
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip git openssl
          git clone https://gitlab.postmarketos.org/postmarketOS/pmbootstrap.git /tmp/pmbootstrap
          python3 /tmp/pmbootstrap/pmbootstrap.py --assume-yes init
          python3 /tmp/pmbootstrap/pmbootstrap.py --assume-yes install --split --sparse
