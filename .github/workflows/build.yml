name: Build postmarketOS
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip git openssl
          git clone https://gitlab.postmarketos.org/postmarketOS/pmbootstrap.git
          sudo ln -s $(pwd)/pmbootstrap/pmbootstrap.py /usr/local/bin/pmbootstrap
      - name: Build postmarketOS
        run: |
          # 1. 强制清理并准备目录
          rm -rf /home/runner/work /home/runner/.local/var/pmbootstrap /home/runner/.config/pmbootstrap
          mkdir -p /home/runner/work /home/runner/.local/var/pmbootstrap/cache_git/pmaports
          
          # 2. 克隆 pmaports 到 pmbootstrap 指定的默认路径
          git clone https://gitlab.postmarketos.org/postmarketOS/pmaports.git /home/runner/.local/var/pmbootstrap/cache_git/pmaports
          
          # 3. 生成基础配置文件 (必须存在 section [pmbootstrap])
          mkdir -p /home/runner/.config/pmbootstrap
          cat <<INI > /home/runner/.config/pmbootstrap/config.ini
          [pmbootstrap]
          work = /home/runner/work
          aports = /home/runner/.local/var/pmbootstrap/cache_git/pmaports
          device = xiaomi-santoni
          ui = sxmo-de-dwm
          timezone = Asia/Shanghai
          mirrors_rsync = http://dl.alpinelinux.org/alpine/
          INI
          
          # 4. 执行安装
          # 这里不运行 init，直接通过 --config 运行 install
          python3 pmbootstrap/pmbootstrap.py --config /home/runner/.config/pmbootstrap/config.ini install --split --sparse
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: postmarketos-xiaomi-santoni
          path: /home/runner/work/chroot_rootfs_xiaomi-santoni/
