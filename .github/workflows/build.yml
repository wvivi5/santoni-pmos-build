name: Build postmarketOS
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip git openssl
          git clone --depth 1 https://gitlab.postmarketos.org/postmarketOS/pmbootstrap.git /tmp/pmbootstrap
          sudo ln -s /tmp/pmbootstrap/pmbootstrap.py /usr/local/bin/pmbootstrap
      - name: Build postmarketOS
        run: |
          # 1. 准备目录结构，并显式克隆 master 分支
          mkdir -p /home/runner/work /home/runner/pmaports
          git clone --depth 1 -b master https://gitlab.postmarketos.org/postmarketOS/pmaports.git /home/runner/pmaports
          
          # 2. 确保配置
          mkdir -p /home/runner/.config/pmbootstrap
          cat <<INI > /home/runner/.config/pmbootstrap/config.ini
[pmbootstrap]
work = /home/runner/work
aports = /home/runner/pmaports
device = xiaomi-santoni
ui = sxmo-de-dwm
timezone = Asia/Shanghai
mirrors_rsync = http://dl.alpinelinux.org/alpine/
          INI
          
          # 3. 安装
          python3 /tmp/pmbootstrap/pmbootstrap.py --config /home/runner/.config/pmbootstrap/config.ini install --split --sparse --assume-yes
          
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: postmarketos-xiaomi-santoni
          path: /home/runner/work/chroot_rootfs_xiaomi-santoni/
