name: Build postmarketOS
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip git openssl
          git clone https://gitlab.postmarketos.org/postmarketOS/pmbootstrap.git
          sudo ln -s $(pwd)/pmbootstrap/pmbootstrap.py /usr/local/bin/pmbootstrap
      - name: Build postmarketOS
        run: |
          # 建立标准工作目录
          mkdir -p /home/runner/.local/var/pmbootstrap/cache_git
          
          # 克隆 pmaports
          git clone https://gitlab.postmarketos.org/postmarketOS/pmaports.git /home/runner/.local/var/pmbootstrap/cache_git/pmaports
          
          # 创建最基本的配置文件（不带交互）
          mkdir -p /home/runner/.config/pmbootstrap
          cat <<JSON > /home/runner/.config/pmbootstrap/config.json
          {
            "work": "/home/runner/work",
            "aports": "/home/runner/.local/var/pmbootstrap/cache_git/pmaports",
            "device": "xiaomi-santoni",
            "ui": "sxmo-de-dwm",
            "timezone": "Asia/Shanghai",
            "mirrors_rsync": "http://dl.alpinelinux.org/alpine/"
          }
          JSON
          
          # 执行安装
          python3 pmbootstrap/pmbootstrap.py install
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: postmarketos-xiaomi-santoni
          path: /home/runner/work/chroot_rootfs_xiaomi-santoni/
