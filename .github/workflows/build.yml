name: Build postmarketOS
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip git openssl
          git clone https://gitlab.postmarketos.org/postmarketOS/pmbootstrap.git
          sudo ln -s $(pwd)/pmbootstrap/pmbootstrap.py /usr/local/bin/pmbootstrap
      - name: Build postmarketOS
        run: |
          # 建立标准工作目录和 pmaports 路径
          mkdir -p /home/runner/work /home/runner/pmaports
          
          # 克隆 pmaports
          git clone https://gitlab.postmarketos.org/postmarketOS/pmaports.git /home/runner/pmaports
          
          # 创建一个有效的 config.ini
          mkdir -p /home/runner/.config/pmbootstrap
          cat <<INI > /home/runner/.config/pmbootstrap/config.ini
          [pmbootstrap]
          work = /home/runner/work
          aports = /home/runner/pmaports
          device = xiaomi-santoni
          ui = sxmo-de-dwm
          timezone = Asia/Shanghai
          mirrors_rsync = http://dl.alpinelinux.org/alpine/
          INI
          
          # 运行 install 并使用我们创建的 config.ini
          python3 pmbootstrap/pmbootstrap.py --config /home/runner/.config/pmbootstrap/config.ini install --split --sparse
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: postmarketos-xiaomi-santoni
          path: /home/runner/work/chroot_rootfs_xiaomi-santoni/
