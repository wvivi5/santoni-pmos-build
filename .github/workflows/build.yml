name: Build postmarketOS
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip git openssl
          # 推荐安装方法：通过 pip 安装 pmbootstrap 库
          pip3 install --break-system-packages pmbootstrap
          # 确认安装位置并设置别名，如果需要的话
          sudo ln -s /usr/local/bin/pmbootstrap /usr/bin/pmbootstrap || true
      - name: Build postmarketOS
        run: |
          # 强制更新 pmbootstrap 环境配置
          export PMB_AS_ROOT=1
          pmbootstrap --as-root init -w /home/runner/work -p /home/runner/pmaports -d xiaomi-santoni -u sxmo-de-dwm -t Asia/Shanghai -y
          
          # 尝试使用非交互式构建指令
          pmbootstrap --as-root install --split --sparse
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: postmarketos-xiaomi-santoni
          path: /home/runner/work/chroot_rootfs_xiaomi-santoni/
