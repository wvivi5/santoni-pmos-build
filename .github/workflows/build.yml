name: Build postmarketOS
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip git openssl
          # 使用 pip 安装 pmbootstrap，强制 root 运行只需 --as-root
          pip3 install --break-system-packages pmbootstrap
      - name: Build postmarketOS
        run: |
          # 创建工作目录
          mkdir -p /home/runner/work /home/runner/pmaports
          
          # 克隆 pmaports
          git clone --depth 1 https://gitlab.postmarketos.org/postmarketOS/pmaports.git /home/runner/pmaports
          
          # 非交互式初始化 (使用 --as-root 跳过 root 检测)
          # 使用 --work 等参数直接指定配置，避免交互询问
          pmbootstrap --as-root init -w /home/runner/work -p /home/runner/pmaports -d xiaomi-santoni -u sxmo-de-dwm -t Asia/Shanghai -y
          
          # 准备构建环境
          pmbootstrap --as-root build_init
          
          # 构建镜像
          pmbootstrap --as-root install --split --sparse
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: postmarketos-xiaomi-santoni
          path: /home/runner/work/chroot_rootfs_xiaomi-santoni/home/pmos/
