name: Build postmarketOS
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip git openssl
          git clone https://gitlab.postmarketos.org/postmarketOS/pmbootstrap.git
          sudo ln -s $(pwd)/pmbootstrap/pmbootstrap.py /usr/local/bin/pmbootstrap
      - name: Build postmarketOS
        run: |
          # 1. 彻底清理：删除可能存在旧配置和旧 work 的目录
          sudo rm -rf /home/runner/work /home/runner/.local/var/pmbootstrap /home/runner/.config/pmbootstrap
          mkdir -p /home/runner/work /home/runner/pmaports
          
          # 2. 克隆 pmaports
          git clone https://gitlab.postmarketos.org/postmarketOS/pmaports.git /home/runner/pmaports
          
          # 3. 运行初始化并创建一个全新的配置
          # 使用 --yes 自动确认，避免交互卡住
          python3 pmbootstrap/pmbootstrap.py -y init
          
          # 4. 执行安装
          python3 pmbootstrap/pmbootstrap.py -y install --split --sparse
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: postmarketos-xiaomi-santoni
          path: /home/runner/work/chroot_rootfs_xiaomi-santoni/
