name: Build postmarketOS
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip git openssl
          # 直接使用 postmarketOS 的安装脚本（这是最稳定的方式）
          git clone https://gitlab.postmarketos.org/postmarketOS/pmbootstrap.git
          sudo ln -s $(pwd)/pmbootstrap/pmbootstrap.py /usr/local/bin/pmbootstrap
      - name: Build postmarketOS
        run: |
          # 运行构建，并使用正确的参数
          # 确保环境变量设置
          export PMB_AS_ROOT=1
          
          # 检查 pmbootstrap 是否正常
          python3 pmbootstrap/pmbootstrap.py --version
          
          # 生成配置文件 (通过创建必要的 config.json 或通过参数)
          # 这里采用参数方式配置，避免交互
          python3 pmbootstrap/pmbootstrap.py config work /home/runner/work
          python3 pmbootstrap/pmbootstrap.py config aports /home/runner/pmaports
          
          # 执行构建
          python3 pmbootstrap/pmbootstrap.py install --split --sparse --device xiaomi-santoni --ui sxmo-de-dwm --timezone Asia/Shanghai --non-interactive
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: postmarketos-xiaomi-santoni
          path: /home/runner/work/chroot_rootfs_xiaomi-santoni/
