name: Build postmarketOS
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip git openssl
          git clone https://gitlab.postmarketos.org/postmarketOS/pmbootstrap.git
          sudo ln -s $(pwd)/pmbootstrap/pmbootstrap.py /usr/local/bin/pmbootstrap
      - name: Build postmarketOS
        run: |
          # 建立标准工作目录
          mkdir -p /home/runner/work /home/runner/pmaports
          
          # 克隆 pmaports
          git clone https://gitlab.postmarketos.org/postmarketOS/pmaports.git /home/runner/pmaports
          
          # 执行初始化，使用环境变量预填值
          # 通过 export 覆盖交互式输入
          export PMB_WORK=/home/runner/work
          export PMB_APORTS=/home/runner/pmaports
          
          # 尝试通过环境变量运行 pmbootstrap
          python3 pmbootstrap/pmbootstrap.py --assume-yes init
          
          # 强制修改配置
          python3 pmbootstrap/pmbootstrap.py config device xiaomi-santoni
          python3 pmbootstrap/pmbootstrap.py config ui sxmo-de-dwm
          
          # 执行安装
          python3 pmbootstrap/pmbootstrap.py install
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: postmarketos-xiaomi-santoni
          path: /home/runner/work/chroot_rootfs_xiaomi-santoni/
