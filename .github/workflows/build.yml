name: Build postmarketOS
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip git openssl
          # 直接使用 postmarketOS 的安装脚本（这是最稳定的方式）
          git clone https://gitlab.postmarketos.org/postmarketOS/pmbootstrap.git
          sudo ln -s $(pwd)/pmbootstrap/pmbootstrap.py /usr/local/bin/pmbootstrap
      - name: Build postmarketOS
        run: |
          # 强制更新 pmbootstrap 环境配置
          export PMB_AS_ROOT=1
          # 使用 init 命令并跳过所有配置步骤（创建空配置文件）
          # pmbootstrap 会自动在 /home/runner/.config/pmbootstrap 中生成配置
          python3 pmbootstrap/pmbootstrap.py init -w /home/runner/work -p /home/runner/pmaports -d xiaomi-santoni -u sxmo-de-dwm -t Asia/Shanghai
          
          # 执行构建
          python3 pmbootstrap/pmbootstrap.py install --split --sparse --non-interactive
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: postmarketos-xiaomi-santoni
          path: /home/runner/work/chroot_rootfs_xiaomi-santoni/
