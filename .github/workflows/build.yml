name: Build postmarketOS
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip git openssl
          git clone https://gitlab.postmarketos.org/postmarketOS/pmbootstrap.git /tmp/pmbootstrap
          sudo ln -s /tmp/pmbootstrap/pmbootstrap.py /usr/local/bin/pmbootstrap
          
      - name: Build postmarketOS
        run: |
          # 在临时目录中操作，避免破坏 runner 环境
          export PMB_WORK=/tmp/work
          export PMB_APORTS=/tmp/pmaports
          mkdir -p $PMB_WORK $PMB_APORTS
          
          # 克隆 pmaports
          git clone https://gitlab.postmarketos.org/postmarketOS/pmaports.git $PMB_APORTS
          
          # 运行 init 和 install
          # 使用 -y 自动应答
          python3 /tmp/pmbootstrap/pmbootstrap.py -y init
          python3 /tmp/pmbootstrap/pmbootstrap.py -y install --split --sparse
          
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: postmarketos-xiaomi-santoni
          path: /tmp/work/chroot_rootfs_xiaomi-santoni/
