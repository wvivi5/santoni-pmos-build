name: Build postmarketOS
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip git openssl
          # 直接使用 postmarketOS 的安装脚本（这是最稳定的方式）
          git clone https://gitlab.postmarketos.org/postmarketOS/pmbootstrap.git
          sudo ln -s $(pwd)/pmbootstrap/pmbootstrap.py /usr/local/bin/pmbootstrap
      - name: Build postmarketOS
        run: |
          # 检查 pmbootstrap 版本
          pmbootstrap --version
          
          # 运行构建（注意：pmbootstrap init 交互式任务可能需要在 workflow 中跳过）
          # 我们尝试直接配置并构建，而不通过 init 脚本进行交互
          pmbootstrap config work /home/runner/work
          pmbootstrap config aports /home/runner/pmaports
          
          # 构建
          pmbootstrap install --split --sparse
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: postmarketos-xiaomi-santoni
          path: /home/runner/work/chroot_rootfs_xiaomi-santoni/
