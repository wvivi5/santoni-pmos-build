name: Build postmarketOS
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip git openssl
          # 通过 git 克隆安装 pmbootstrap
          git clone https://gitlab.postmarketos.org/postmarketOS/pmbootstrap.git
          cd pmbootstrap
          # 检查是否存在 setup.py
          if [ -f setup.py ]; then
            sudo python3 setup.py install
          else
            # 如果是纯 python 项目且有 pyproject.toml，尝试用 pip 安装当前目录
            sudo pip3 install --break-system-packages .
          fi
      - name: Build postmarketOS
        run: |
          # 强制更新 pmbootstrap 环境配置
          export PMB_AS_ROOT=1
          pmbootstrap --as-root init -w /home/runner/work -p /home/runner/pmaports -d xiaomi-santoni -u sxmo-de-dwm -t Asia/Shanghai -y
          
          # 尝试使用非交互式构建指令
          pmbootstrap --as-root install --split --sparse
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: postmarketos-xiaomi-santoni
          path: /home/runner/work/chroot_rootfs_xiaomi-santoni/
