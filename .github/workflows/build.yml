name: Build postmarketOS
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip git openssl
          # 直接使用 postmarketOS 的安装脚本（这是最稳定的方式）
          git clone https://gitlab.postmarketos.org/postmarketOS/pmbootstrap.git
          sudo ln -s $(pwd)/pmbootstrap/pmbootstrap.py /usr/local/bin/pmbootstrap
      - name: Build postmarketOS
        run: |
          # 强制更新 pmbootstrap 环境配置
          export PMB_AS_ROOT=1
          
          # 直接使用 pmbootstrap 的安装目录运行
          # 初始化环境（仅在必要时执行，或者利用现有的 config）
          python3 pmbootstrap/pmbootstrap.py init -w /home/runner/work -p /home/runner/pmaports
          
          # 使用 init 命令配置设备和环境（通过交互式模拟或参数）
          # 由于我们之前遇到 init 报错，这里尝试直接配置设备信息
          python3 pmbootstrap/pmbootstrap.py config device xiaomi-santoni
          python3 pmbootstrap/pmbootstrap.py config ui sxmo-de-dwm
          
          # 构建
          python3 pmbootstrap/pmbootstrap.py install --split --sparse --non-interactive
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: postmarketos-xiaomi-santoni
          path: /home/runner/work/chroot_rootfs_xiaomi-santoni/
